name: Publish
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require a matching version tag
        run: node -e 'const p = require("./package.json"); require("node:assert/strict").equal(process.env.GITHUB_REF, "refs/tags/v" + p.version)'
      - run: npm install --global npm@11.18.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm audit --omit=dev
      - name: Generate the dependency SBOM including offline Prism
        run: npm sbom --sbom-format=cyclonedx > tmp/feedback-release/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-release
          path: tmp/feedback-release/*
          if-no-files-found: error
      - name: Publish the verified tarball with OIDC
        run: |
          release_version=$(node -p "require('./package.json').version")
          npm publish "tmp/feedback-release/feedback-mcp-server-${release_version}.tgz" --provenance --access public
